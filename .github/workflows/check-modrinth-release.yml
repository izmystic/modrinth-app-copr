name: Check Modrinth App release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream version
        id: upstream
        run: |
          version=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/modrinth/code/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compare against last seen version
        id: diff
        run: |
          last=$(cat last_version.txt 2>/dev/null || echo "")
          if [ "$last" = "${{ steps.upstream.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Copr rebuild via webhook
        if: steps.diff.outputs.changed == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
        run: |
          clean_url=$(printf '%s' "$WEBHOOK_URL" | tr -d '\n\r' | xargs)
          curl -fsSL -X POST "$clean_url"

      - name: Record new version
        if: steps.diff.outputs.changed == 'true'
        run: |
          echo "${{ steps.upstream.outputs.version }}" > last_version.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_version.txt
          git commit -m "Bump tracked Modrinth App version to ${{ steps.upstream.outputs.version }}"
          git push
